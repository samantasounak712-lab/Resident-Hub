<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ward Notebook">
<meta name="theme-color" content="#0f766e">
<title>Ward Notebook</title>
<link href="https://fonts.googleapis.com/css2?family=Caveat&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef5f6;--card:#fff;--ink:#17262e;--mute:#5d7078;--line:#d3e2e4;--acc:#0f766e;--danger:#c0392b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1a1f;--card:#14262c;--ink:#e6f0f1;--mute:#8fa8ad;--line:#25414a;--acc:#2dd4bf;--danger:#ff7b6b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d1a1f;--card:#14262c;--ink:#e6f0f1;--mute:#8fa8ad;--line:#25414a;--acc:#2dd4bf;--danger:#ff7b6b;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-size:17px}
header{display:flex;gap:8px;align-items:center;padding:10px 14px;background:linear-gradient(90deg,#0f766e,#1e3a8a);flex-wrap:wrap}
h1{font-size:19px;margin:0;flex:1;color:#fff}
button,select,input,textarea{font:inherit;color:var(--ink)}
button{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:9px 13px;cursor:pointer}
button.p{background:linear-gradient(135deg,#0f766e,#1e3a8a);border-color:transparent;color:#fff}
button.d{color:var(--danger)}
header button.p{background:#fff;border-color:#fff;color:#0f766e}
main{display:grid;grid-template-columns:240px 1fr;gap:12px;padding:12px;max-width:1250px;margin:auto}
@media(max-width:760px){main{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
#search{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);margin-bottom:8px}
#list{display:flex;flex-direction:column;gap:6px;max-height:60vh;overflow:auto}
.row{padding:9px 11px;border:1px solid var(--line);border-radius:8px;cursor:pointer}
.row.on{border-color:var(--acc);background:var(--bg)}
.row small{color:var(--mute);display:block}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
label{font-size:13px;color:var(--mute);display:block;margin-bottom:3px}
.grid input,.grid select,.ehead input{width:100%;padding:11px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-size:17px}
.bar{display:flex;gap:8px;align-items:center;margin:12px 0 8px;flex-wrap:wrap}
.sw{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);padding:0}
.sw.on{border-color:var(--acc)}
#pad{width:100%;height:560px;border:1px solid var(--line);border-radius:10px;background:#fff;touch-action:none;display:block}
.muted{color:var(--mute);font-size:14px}
.empty{padding:40px 10px;text-align:center;color:var(--mute)}
details.en{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:10px;background:var(--bg)}
details.en summary{cursor:pointer;padding:6px 0;font-size:17px}
.ehead{display:flex;gap:10px;align-items:flex-end;margin-top:8px}
.ehead>div{flex:0 0 200px}
.eg{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:12px;margin-top:12px}
.sec textarea{width:100%;min-height:170px;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--card);resize:vertical;font-size:18px;line-height:1.5}
.sec .hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.sec .hd label{margin:0;font-size:14px}
.mic{padding:6px 12px;font-size:14px}
.mic.rec{background:var(--danger);border-color:var(--danger);color:#fff}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
#ov .card{width:100%;max-width:800px}
#ov textarea{width:100%;height:50vh;font:14px ui-monospace,monospace;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px}
</style>
</head>
<body>
<header>
  <h1>Ward Notebook</h1>
  <button class="p" id="new">+ New patient</button>
  <button id="exp">Export</button>
</header>
<main>
  <section class="card">
    <input id="search" placeholder="Search by ID, bed, or diagnosis" type="search">
    <div id="list"></div>
  </section>
  <section class="card" id="editor"></section>
</main>
<script>
(function(){
function toast(m){var d=document.createElement("div");d.textContent=m;d.style.cssText="position:fixed;left:50%;bottom:24px;transform:translateX(-50%);max-width:90%;background:#1c2430;color:#fff;padding:10px 14px;border-radius:10px;z-index:99;font:14px system-ui,sans-serif";document.body.appendChild(d);setTimeout(function(){d.remove()},4000)}
var alert=function(m){toast(m)};
function arm(btn,fn){
  if(btn.dataset.armed){clearTimeout(btn._t);delete btn.dataset.armed;btn.textContent=btn._o;fn();return}
  btn._o=btn.textContent;btn.dataset.armed="1";btn.textContent="Tap again to confirm";
  btn._t=setTimeout(function(){delete btn.dataset.armed;btn.textContent=btn._o},3000);
}
var KEY="wardnotebook.v1",pts=[],cur=null,color="#111111",erase=false,rec=null,recBtn=null;
var ENF=[["inv","Investigations & findings"],["adv","Advice"],["plan","Plan"]];
function $(id){return document.getElementById(id)}
function esc(s){return String(s||"").replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function today(){var d=new Date();return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2)}
function fmt(d){if(!d)return "No date";var x=new Date(d+"T00:00:00");return isNaN(x)?d:x.toLocaleDateString(undefined,{day:"numeric",month:"short",year:"numeric"})}
function load(){
  try{pts=JSON.parse(localStorage.getItem(KEY)||"[]")}catch(e){pts=[]}
  pts.forEach(function(p){if(!p.log){p.log=[];if(p.inv||p.fnd||p.adv)p.log.push({id:"e"+Math.random().toString(36).slice(2),date:p.adm||today(),inv:p.inv||"",out:p.fnd||"",adv:p.adv||"",plan:""})}p.log.forEach(function(e){if(e.out){e.inv=(e.inv?e.inv+"\n":"")+e.out;e.out=""}})});
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(pts))}catch(e){alert("Couldn’t save: storage is full or blocked. Use Export to back up.")}}
function curP(){return pts.filter(function(x){return x.id===cur})[0]}
function touch(p){p.upd=Date.now();save();var e=$("ts");if(e)e.textContent="Saved "+new Date(p.upd).toLocaleString()}

function renderList(){
  var q=$("search").value.toLowerCase(),box=$("list");box.innerHTML="";
  var f=pts.filter(function(p){return (p.pid+" "+p.bed+" "+p.dx).toLowerCase().indexOf(q)>-1});
  if(!f.length){box.innerHTML='<div class="empty">No patients yet.</div>';return}
  f.forEach(function(p){
    var d=document.createElement("div");d.className="row"+(cur===p.id?" on":"");
    d.innerHTML="<b>"+esc(p.pid||"Unnamed")+"</b><small>"+esc(p.bed||"No bed")+" · "+esc(p.dx||"No diagnosis")+"</small>";
    d.onclick=function(){cur=p.id;renderList();renderEditor()};
    box.appendChild(d);
  });
}
function sec(k,label,val){return '<div class="sec" data-k="'+k+'"><div class="hd"><label>'+label+'</label><button class="mic">🎤 Dictate</button></div><textarea>'+esc(val)+'</textarea></div>'}
function entryHtml(e,open){
  return '<details class="en" data-id="'+e.id+'"'+(open?' open':'')+'><summary><b class="edt">'+fmt(e.date)+'</b> <span class="muted">'+esc((e.inv||e.out||e.adv||e.plan||"").slice(0,50))+'</span></summary>'+
  '<div class="ehead"><div><label>Date</label><input type="date" class="ed" value="'+esc(e.date)+'"></div><button class="d edel">Delete entry</button></div>'+
  '<div class="eg">'+ENF.map(function(f){return sec(f[0],f[1],e[f[0]])}).join("")+'</div></details>';
}
function renderEditor(){
  if(rec){try{rec.stop()}catch(e){}}
  var ed=$("editor"),p=curP();
  if(!p){ed.innerHTML='<div class="empty">Select a patient or add a new one.</div>';return}
  var st=["Admitted","Stable","Watch","Critical","Discharge planned","Discharged"];
  var log=p.log.slice().sort(function(a,b){return (b.date||"").localeCompare(a.date||"")||(b.id>a.id?1:-1)});
  ed.innerHTML=
   '<div class="grid">'+
   '<div><label>Patient ID / initials</label><input id="f_pid" value="'+esc(p.pid)+'"></div>'+
   '<div><label>Age</label><input id="f_age" inputmode="numeric" value="'+esc(p.age)+'"></div>'+
   '<div><label>Sex</label><select id="f_sex"><option></option><option>F</option><option>M</option><option>Other</option></select></div>'+
   '<div><label>Ward / bed</label><input id="f_bed" value="'+esc(p.bed)+'"></div>'+
   '<div><label>Admitted</label><input id="f_adm" type="date" value="'+esc(p.adm)+'"></div>'+
   '<div><label>Status</label><select id="f_st">'+st.map(function(s){return "<option>"+s+"</option>"}).join("")+'</select></div>'+
   '</div>'+
   '<div style="margin-top:10px"><label>Diagnosis / problem</label><div class="grid" style="grid-template-columns:1fr"><input id="f_dx" value="'+esc(p.dx)+'"></div></div>'+
   '<div class="bar" style="margin-top:18px"><b>Daily log</b><span class="muted">'+log.length+' entries</span><span style="flex:1"></span><button class="p" id="addE">+ Add today’s entry</button></div>'+
   (log.length?log.map(function(e,i){return entryHtml(e,p.openId?e.id===p.openId:i===0)}).join(""):'<div class="muted">No entries yet. Tap “Add today’s entry”.</div>')+
   '<div id="hxw" style="margin-top:18px">'+sec("hx","Other history",p.hx)+'</div>'+
   '<div class="bar"><b>Handwritten notes</b><span style="flex:1"></span>'+
   '<button class="sw on" data-c="#111111" style="background:#111"></button>'+
   '<button class="sw" data-c="#1f6feb" style="background:#1f6feb"></button>'+
   '<button class="sw" data-c="#d0342c" style="background:#d0342c"></button>'+
   '<button class="mic" id="mi">🎤 Dictate</button><button id="er">Eraser</button><button id="cl" class="d">Clear</button></div>'+
   '<canvas id="pad"></canvas>'+
   '<div class="bar"><span class="muted" id="ts"></span><span style="flex:1"></span><button class="d" id="del">Delete patient</button></div>';
  $("f_sex").value=p.sex||"";$("f_st").value=p.st||"Admitted";
  ["pid","age","bed","adm","dx"].forEach(function(k){$("f_"+k).oninput=function(){p[k]=this.value;touch(p);renderList()}});
  $("f_sex").onchange=function(){p.sex=this.value;touch(p)};
  $("f_st").onchange=function(){p.st=this.value;touch(p)};
  var hx=$("hxw").querySelector("textarea");
  hx.oninput=function(){p.hx=this.value;touch(p)};
  $("hxw").querySelector(".mic").onclick=function(){dictate(this,hx,p,"hx")};
  $("addE").onclick=function(){
    var e={id:"e"+Date.now(),date:today(),inv:"",adv:"",plan:""};
    p.log.push(e);p.openId=e.id;touch(p);renderEditor();
    var d=ed.querySelector('details[data-id="'+e.id+'"]');if(d&&d.scrollIntoView)d.scrollIntoView({block:"start"});
  };
  Array.prototype.forEach.call(ed.querySelectorAll("details.en"),function(d){
    var e=p.log.filter(function(x){return x.id===d.dataset.id})[0];if(!e)return;
    d.querySelector(".ed").oninput=function(){e.date=this.value;d.querySelector(".edt").textContent=fmt(e.date);touch(p)};
    Array.prototype.forEach.call(d.querySelectorAll(".sec"),function(s){
      var k=s.dataset.k,ta=s.querySelector("textarea");
      ta.oninput=function(){e[k]=this.value;touch(p)};
      s.querySelector(".mic").onclick=function(){dictate(this,ta,e,k)};
    });
    d.querySelector(".edel").onclick=function(){arm(this,function(){p.log=p.log.filter(function(x){return x!==e});p.openId=null;touch(p);renderEditor()})};
  });
  if(p.upd)$("ts").textContent="Saved "+new Date(p.upd).toLocaleString();
  setupPad(p);
  Array.prototype.forEach.call(ed.querySelectorAll(".sw"),function(b){b.onclick=function(){
    color=b.dataset.c;erase=false;$("er").style.background="";
    Array.prototype.forEach.call(ed.querySelectorAll(".sw"),function(x){x.classList.remove("on")});b.classList.add("on")}});
  $("mi").onclick=function(){if(document.fonts)document.fonts.load("26px Caveat");dictate(this,null,p,"ink")};
  $("er").onclick=function(){erase=!erase;this.style.background=erase?"var(--line)":""};
  $("cl").onclick=function(){arm(this,function(){p.ink="";p.ty=0;touch(p);setupPad(p)})};
  $("del").onclick=function(){arm(this,function(){pts=pts.filter(function(x){return x!==p});cur=null;save();renderList();renderEditor()})};
}

function setupPad(p){
  var c=$("pad"),r=c.getBoundingClientRect(),dpr=window.devicePixelRatio||1;
  c.width=r.width*dpr;c.height=r.height*dpr;
  var x=c.getContext("2d");x.scale(dpr,dpr);x.lineCap="round";x.lineJoin="round";
  x.fillStyle="#fff";x.fillRect(0,0,r.width,r.height);
  if(p.ink){var im=new Image();im.onload=function(){x.drawImage(im,0,0,r.width,r.height)};im.src=p.ink}
  var drawing=false,lx=0,ly=0,timer=null;
  function pos(e){var b=c.getBoundingClientRect();return[e.clientX-b.left,e.clientY-b.top]}
  c.onpointerdown=function(e){drawing=true;c.setPointerCapture(e.pointerId);var a=pos(e);lx=a[0];ly=a[1];seg(e,lx,ly)};
  c.onpointermove=function(e){if(!drawing)return;var a=pos(e);seg(e,a[0],a[1]);lx=a[0];ly=a[1]};
  function end(){if(!drawing)return;drawing=false;clearTimeout(timer);timer=setTimeout(function(){p.ink=c.toDataURL("image/jpeg",0.7);touch(p)},300)}
  c.onpointerup=end;c.onpointercancel=end;
  function seg(e,nx,ny){
    var w=e.pointerType==="pen"?Math.max(1,(e.pressure||0.5)*4.5):2.2;
    x.strokeStyle=erase?"#fff":color;x.lineWidth=erase?18:w;
    x.beginPath();x.moveTo(lx,ly);x.lineTo(nx+0.01,ny);x.stroke();
  }
}
function writeInk(p,t){
  var c=$("pad");if(!c)return;
  var r=c.getBoundingClientRect(),x=c.getContext("2d"),lh=34,m=14,y=p.ty||34;
  x.font="26px Caveat,'Bradley Hand','Segoe Script',cursive";x.fillStyle=erase?"#111111":color;x.textBaseline="alphabetic";
  var words=t.split(/\s+/),line="",full="The pad is full. Clear it, or use the text boxes.";
  function flush(){if(y>r.height-8)return false;x.fillText(line,m,y);y+=lh;line="";return true}
  for(var i=0;i<words.length;i++){
    var test=line?line+" "+words[i]:words[i];
    if(x.measureText(test).width>r.width-2*m&&line){if(!flush()){alert(full);return}line=words[i]}else line=test;
  }
  if(line&&!flush()){alert(full);return}
  p.ty=y;p.ink=c.toDataURL("image/jpeg",0.7);touch(p);
}
function dictate(btn,ta,obj,k){
  var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){alert("Voice typing isn’t supported in this browser. Try Chrome or Safari, or use the mic key on your keyboard.");return}
  if(rec){var same=(recBtn===btn);try{rec.stop()}catch(e){}if(same)return}
  rec=new SR();recBtn=btn;rec.continuous=true;rec.interimResults=false;rec.lang=navigator.language||"en-US";
  rec.onresult=function(e){
    for(var i=e.resultIndex;i<e.results.length;i++){if(e.results[i].isFinal){
      var t=e.results[i][0].transcript.trim();
      if(!ta){writeInk(obj,t);continue}
      ta.value=(ta.value&&!/\s$/.test(ta.value)?ta.value+" ":ta.value)+t;
      obj[k]=ta.value;touch(curP())}}
  };
  rec.onend=function(){btn.classList.remove("rec");btn.textContent="🎤 Dictate";rec=null;recBtn=null};
  rec.onerror=function(e){if(e.error==="not-allowed"||e.error==="service-not-allowed")alert("Microphone access is blocked. Allow it in your browser settings.")};
  btn.classList.add("rec");btn.textContent="⏹ Stop";
  try{rec.start()}catch(e){}
}

$("new").onclick=function(){
  var p={id:"p"+Date.now(),pid:"",age:"",sex:"",bed:"",adm:today(),st:"Admitted",dx:"",hx:"",ink:"",log:[],upd:Date.now()};
  pts.unshift(p);cur=p.id;save();renderList();renderEditor();
};
$("search").oninput=renderList;
$("exp").onclick=function(){
  var rows=[["ID","Age","Sex","Bed","Admitted","Status","Diagnosis","Entry date","Investigations & findings","Advice","Plan","Other history"]];
  pts.forEach(function(p){
    var base=[p.pid,p.age,p.sex,p.bed,p.adm,p.st,p.dx];
    if(!p.log.length)rows.push(base.concat(["","","","",p.hx]));
    p.log.slice().sort(function(a,b){return (a.date||"").localeCompare(b.date||"")}).forEach(function(e){rows.push(base.concat([e.date,e.inv,e.adv,e.plan,p.hx]))});
  });
  var csv=rows.map(function(r){return r.map(function(v){return '"'+String(v||"").replace(/"/g,'""')+'"'}).join(",")}).join("\n");
  var o=document.createElement("div");o.id="ov";
  o.innerHTML='<div class="card"><b>Export (CSV)</b><p class="muted">Tap Select all, then copy it into a note or email to yourself.</p><textarea readonly></textarea><div class="bar"><button class="p" id="sa">Select all</button><button id="xc">Close</button></div></div>';
  document.body.appendChild(o);
  var ta=o.querySelector("textarea");ta.value=csv;
  $("sa").onclick=function(){ta.focus();ta.select();var ok=false;try{ok=document.execCommand("copy")}catch(e){}toast(ok?"Copied to clipboard":"Selected. Use Copy from the pop-up menu.")};
  $("xc").onclick=function(){o.remove()};
};
load();renderList();renderEditor();
})();
</script>
</body>
</html>
